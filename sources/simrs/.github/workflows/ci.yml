name: SIMRS Backend CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  verify-architecture:
    name: Lint, Architecture Boundaries & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: simrs_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Langkah 1: Cek batas modul otomatis
      - name: Verify Architecture Boundaries (dependency-cruiser)
        run: npx depcruise src --config .dependency-cruiser.cjs

      # Langkah 2: Jalankan ESLint
      - name: Run ESLint
        run: npm run lint

      # Langkah 3: Jalankan Automated Unit Tests (tanpa database)
      - name: Run Automated Unit Tests
        run: npm test

